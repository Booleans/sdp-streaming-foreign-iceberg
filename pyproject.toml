[project]
name = "gpu-telemetry-iceberg-sdp"
version = "0.1.0"
description = "Reproduce streaming reads from Glue Iceberg tables with Spark Declarative Pipelines"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
local = ["pyspark[pipelines]==4.1.0"]

[project.scripts]
gpu-iceberg = "gpu_telemetry_iceberg.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_telemetry_iceberg"]
